<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#2f6b4f"><title>献立おたすけ v5</title>
<style>
:root{--g:#2f6b4f;--p:#edf6ef;--l:#dce6de;--t:#233128;--m:#66736a}
*{box-sizing:border-box}body{margin:0;background:#f6f8f5;color:var(--t);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}
header{background:var(--g);color:white;padding:10px 13px}h1{margin:0;font-size:1.15rem}header p{display:none}
main{max-width:760px;margin:auto;padding:8px}
.card{background:white;border:1px solid var(--l);border-radius:11px;padding:10px;margin-bottom:8px}
h2{font-size:.98rem;margin:0 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
label.field{display:block;font-weight:700;margin:7px 0 4px}
.checks{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid var(--l);border-radius:25px;padding:5px 9px;display:flex;gap:5px;align-items:center}.pill input{width:16px;height:16px;accent-color:var(--g)}
select,input[type=text]{width:100%;font:inherit;padding:7px;border:1px solid #cbd8ce;border-radius:7px;background:white}
button{font:inherit;font-weight:700;border:0;border-radius:7px;padding:6px 8px;cursor:pointer}.primary{background:var(--g);color:white;width:100%;margin-top:9px;padding:9px}
.secondary{background:var(--p);color:var(--g)}.danger{background:#fff0ef;color:#a23c35}.small{font-size:.78rem;padding:5px 7px}
.tabs{display:flex;gap:5px;position:sticky;top:0;background:#f6f8f5;padding:5px 0;z-index:5;touch-action:pan-y}
.tab{flex:1;background:#e7eee8;color:#536359;padding:9px 4px}.tab.active{background:var(--g);color:white}
.panel{display:none}.panel.active{display:block}html,body,.panel,.tabs,button{touch-action:manipulation}.empty{text-align:left}
.day{border:1px solid var(--l);border-radius:9px;margin:7px 0;overflow:hidden}
.daytitle{background:var(--p);font-weight:800;padding:6px 9px}
.meal{padding:7px 8px;border-top:1px solid var(--l)}.mealtype{font-size:.72rem;color:var(--g);font-weight:800;margin-bottom:2px}
.dish{display:flex;align-items:center;gap:5px;padding:3px 0;min-height:32px}
.dishname{flex:1;min-width:0;font-weight:700;cursor:pointer}.dishname:active{opacity:.7}
.iconbtn{flex:none;padding:4px 6px;font-size:.78rem;background:#f0f4f0;color:var(--g)}.star{font-size:1rem;padding:2px 4px;background:transparent}
.recipe{background:#f8faf7;padding:8px;border-radius:7px;margin:4px 0 7px;font-size:.82rem}.recipe ul,.recipe ol{margin:4px 0;padding-left:20px}.recipe li{margin:2px 0}
.muted{font-size:.77rem;color:var(--m)}.item{display:flex;gap:8px;padding:6px 2px;border-bottom:1px solid #edf1ed;align-items:center}.item input{width:18px;height:18px;accent-color:var(--g)}.item span:first-of-type{flex:1}.item.done span:first-of-type{text-decoration:line-through;color:#89938c}.amt{font-weight:700;white-space:nowrap}
.fav{border:1px solid var(--l);border-radius:8px;padding:8px;margin:6px 0}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.empty{padding:12px;text-align:center;color:var(--m)}.notice{display:none}
@media(max-width:480px){main{padding:6px}.card{padding:8px}.grid{gap:6px}.dish{gap:3px}.iconbtn{font-size:.72rem;padding:4px}.day{margin:5px 0}}
@media print{header,#setup,.tabs,.no-print{display:none!important}.panel{display:block!important}body{background:white}.card{border:0}}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.daytitle{text-align:left}.meal,.dish,.dishname{text-align:left}
</style></head><body>
<header><h1>🍳 献立おたすけ</h1><p>主菜・副菜・汁物を組み合わせて、買い物リストまで自動作成</p></header>
<main>
<section class="card" id="setup"><h2>① 献立の条件</h2><div class="grid"><div><label class="field">何日分？</label><select id="days"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option selected>7</option><option>14</option></select></div><div><label class="field">何人分？</label><select id="people"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div></div>
<label class="field">作りたい食事</label><div class="checks"><label class="pill"><input type="checkbox" id="lunch">昼ごはん</label><label class="pill"><input type="checkbox" id="dinner" checked>夜ごはん</label></div>
<div class="grid"><div><label class="field">献立の傾向</label><select id="style"><option value="all">おまかせ</option><option value="japanese">和食多め</option><option value="western">洋食多め</option><option value="chinese">中華多め</option><option value="quick">時短多め</option></select></div><div><label class="field">食材の使い回し</label><select id="reuse"><option value="high">多め・食材の種類を抑える</option><option value="mid">ほどほど</option><option value="low">料理のバリエーション優先</option></select></div></div>
<label class="field">使いたくない食材（「、」区切り）</label><input id="exclude" type="text" placeholder="例：きのこ、豚肉">
<button class="primary" onclick="generate()">🎲 献立を作る</button></section>

<nav class="tabs no-print">
<button class="tab active" onclick="showTab('menuPanel',this)">献立</button>
<button class="tab" onclick="showTab('shopPanel',this)">買い物リスト</button>
<button class="tab" onclick="showTab('favPanel',this)">お気に入り</button>
</nav>
<section id="menuPanel" class="panel active">
<div class="card"><div class="head"><h2>献立</h2><button class="secondary small no-print" onclick="generate()">考え直す</button></div><div id="menu" class="empty">条件を選んで献立を作成</div></div>
</section>
<section id="shopPanel" class="panel">
<div class="card"><div class="head"><h2>買い物リスト</h2><button class="secondary small no-print" onclick="document.querySelectorAll('.item input').forEach(x=>{x.checked=false;x.parentElement.classList.remove('done')})">解除</button></div><div id="shopping" class="empty">献立を作ると表示</div><div class="actions no-print"><button class="secondary" onclick="copyList()">リストをコピー</button></div><div id="status" class="muted"></div></div>
</section>
<section id="favPanel" class="panel">
<div class="card"><div class="head"><h2>お気に入り</h2><span id="count" class="muted">0件</span></div><div id="favorites"><div class="empty">まだありません</div></div></div>
</section>

</main>
<script>

R('豚肉と白菜のうま煮','japanese',[['豚こま肉',350,'g'],['白菜',500,'g'],['にんじん',100,'g'],['しょうゆ',2,'大さじ'],['鶏ガラスープの素',2,'小さじ']],['白菜とにんじんを切る。','豚肉を炒め、野菜・水・鶏ガラスープの素を加えて煮る。','しょうゆで味を調える。']),

R('豆腐ハンバーグ','japanese',[['合いびき肉',400,'g'],['木綿豆腐',300,'g'],['玉ねぎ',1,'個'],['卵',1,'個'],['パン粉',30,'g']],['豆腐を水切りし、玉ねぎをみじん切りにする。','材料を混ぜて小判形に整える。','両面を焼き、ふたをして中まで火を通す。'],false),
R('カレーライス','japanese',[['豚こま肉',400,'g'],['じゃがいも',500,'g'],['にんじん',150,'g'],['玉ねぎ',2,'個'],['カレールウ',100,'g'],['ごはん',800,'g']],['肉と野菜を切って炒め、水を加えて煮る。','具材が柔らかくなったら火を止めてルウを溶かす。','弱火で少し煮てごはんにかける。'],false),

R('ポークチャップ','western',[['豚ロース肉',600,'g'],['玉ねぎ',1,'個'],['ケチャップ',3,'大さじ'],['ウスターソース',1,'大さじ']],['玉ねぎを薄切りにする。','豚肉と玉ねぎを焼く。','ケチャップとソースを加えてからめる。']),

R('オムライス','western',[['卵',6,'個'],['鶏もも肉',300,'g'],['玉ねぎ',1,'個'],['ごはん',800,'g'],['ケチャップ',4,'大さじ']],['鶏肉と玉ねぎを小さく切って炒める。','ごはんとケチャップを加えて炒める。','卵を焼いてチキンライスにのせる。']),

R('そぼろ丼','japanese',[['鶏ひき肉',400,'g'],['卵',4,'個'],['ごはん',800,'g'],['しょうゆ',2,'大さじ'],['砂糖',1,'大さじ']],['鶏ひき肉を炒め、しょうゆと砂糖で味付けする。','卵を炒り卵にする。','ごはんにそぼろと炒り卵を盛る。']),
R('鶏肉ときのこのバターしょうゆ炒め','japanese',[['鶏もも肉',400,'g'],['しめじ',200,'g'],['玉ねぎ',1,'個'],['バター',15,'g'],['しょうゆ',1,'大さじ']],['鶏肉と野菜を食べやすく切る。','鶏肉を炒めて火を通し、野菜を加える。','バターとしょうゆで味付けする。']),
R('豚バラ大根','japanese',[['豚バラ肉',350,'g'],['大根',500,'g'],['しょうゆ',3,'大さじ'],['みりん',2,'大さじ'],['砂糖',1,'大さじ']],['大根をいちょう切りにする。','豚肉を炒め、大根と水を加えて煮る。','調味料を加えて大根が柔らかくなるまで煮る。'],false),

R('鮭とじゃがいもの味噌バター焼き','japanese',[['生鮭',4,'切れ'],['じゃがいも',400,'g'],['玉ねぎ',1,'個'],['味噌',2,'大さじ'],['バター',20,'g']],['じゃがいもを薄切りにしてレンジで加熱する。','鮭と玉ねぎを焼き、じゃがいもを加える。','味噌を少量の水で溶いて加え、バターをのせる。']),

 const usedNames=new Set();
 meals.forEach(x=>x.parts.forEach((r,j)=>{if(x===m&&j===index)return;if(index===0&&j===0&&x.type===type)usedNames.add(r.name);if(index===1&&j===1&&x.type==='dinner')usedNames.add(r.name);if(index===2&&j===2&&x.type==='dinner')usedNames.add(r.name)}));
 const styleOK=r=>(style==='all'||(style==='quick'&&r.quick)||r.type===style);
 const overlap=r=>r.ing.reduce((n,a)=>n+old.ing.filter(b=>norm(b[0])===norm(a[0])).length,0);
 // 条件を段階的に緩める。候補が少ない時は「未使用」「傾向」「食材一致」を優先しすぎない。
 let candidates=base.filter(r=>r.name!==old.name&&!excluded(r,ex));
 if(!candidates.length)candidates=base.filter(r=>r.name!==old.name);
 let fresh=candidates.filter(r=>!recent.includes(r.name));
 if(fresh.length>=3)candidates=fresh; else if(fresh.length)candidates=fresh;
 let notBlocked=candidates.filter(r=>!blockedNames.has(r.name));
 if(notBlocked.length>=3)candidates=notBlocked; else if(notBlocked.length)candidates=notBlocked;
 let unused=candidates.filter(r=>!usedNames.has(r.name));
 if(unused.length>=3)candidates=unused; else if(unused.length)candidates=unused;
 // 食材一致を加点しつつ、最高一致だけに固定しない。候補の幅を残して毎回違う料理を出す。
 let scored=candidates.map(r=>({r,score:overlap(r)*2+(styleOK(r)?1:0)+(usedNames.has(r.name)?-1:0)}));
 let max=Math.max(...scored.map(x=>x.score)), pool=scored.filter(x=>x.score>=max-2);
 let replacement=pool[Math.floor(Math.random()*pool.length)]?.r;
 if(!replacement){alert('変更候補が見つからなかったよ。');return;}
 recent.push(old.name,replacement.name);recent=[...new Set(recent)].slice(-6);recentBySlot.set(slotKey,recent);
 blockedNames.add(old.name);m.parts[index]=replacement;renderMenu();renderShopping();
}
function toggleFav(r){let i=favs.findIndex(x=>x.name===r.name);if(i>=0)favs.splice(i,1);else favs.push(r);localStorage.setItem('kondateFavsV2',JSON.stringify(favs));renderMenu();renderFavs()}
function renderFavs(){let el=document.getElementById('favorites');el.innerHTML='';document.getElementById('count').textContent=favs.length+'件';if(!favs.length){el.innerHTML='<div class="empty">お気に入りはまだありません。</div>';return}favs.forEach(r=>{let box=document.createElement('div');box.className='fav';let h=document.createElement('b');h.textContent=r.name;let p=document.createElement('p');p.className='muted';p.textContent='材料：'+r.ing.map(x=>x[0]).join('、');let acts=document.createElement('div');acts.className='actions no-print';let add=document.createElement('button');add.className='secondary small';add.textContent='献立に追加';add.onclick=()=>addFav(r);let del=document.createElement('button');del.className='danger small';del.textContent='削除';del.onclick=()=>toggleFav(r);let kur=document.createElement('button');kur.className='secondary small';kur.textContent='クラシルで探す';kur.onclick=()=>openKurashiru(r.name);acts.append(add,kur,del);box.append(h,p,acts);el.append(box)})}
function addFav(r){let slots=[];for(let d=1;d<=+document.getElementById('days').value;d++){if(document.getElementById('lunch').checked)slots.push({day:d,type:'lunch'});if(document.getElementById('dinner').checked)slots.push({day:d,type:'dinner'})}let s=slots.find(s=>!meals.some(m=>m.day===s.day&&m.type===s.type));if(s){if(s.type==='dinner'){let side=choose(sides,new Set()),soup=choose(soups,new Set());meals.push({day:s.day,type:s.type,parts:[r,side,soup]})}else meals.push({day:s.day,type:s.type,parts:[r]})}else{alert('追加できる空き枠がないよ');return}renderMenu();renderShopping();showTab('menuPanel',document.querySelector('.tab'));document.getElementById('menuPanel').scrollIntoView({behavior:'smooth'})}
function renderShopping(){
 let people=+document.getElementById('people').value,sums=new Map();
 const condiments=['しょうゆ','醤油','みりん','砂糖','塩','こしょう','味噌','めんつゆ','鶏ガラスープの素','コンソメ','カレールウ','シチュールウ','麻婆豆腐の素','回鍋肉の素','焼きそばソース','ケチャップ','ウスターソース','オイスターソース','焼肉のたれ','ドレッシング','ごまドレッシング','マヨネーズ','ごま油','オリーブ油','酢','レモン汁','カレー粉','塩昆布','かつお節','パン粉','小麦粉','カットトマト缶'];
 meals.forEach(m=>m.parts.forEach(r=>r.ing.forEach(([raw,q,u])=>{
   let n=norm(raw),qty=+q*people/4,unit=u;
   if(n==='トマト缶')n='カットトマト缶';
   // 大さじ・小さじ・カップをmL換算して、同じ調味料は一行にまとめる
   if(['大さじ','小さじ','カップ'].includes(unit)){
     qty*=unit==='大さじ'?15:unit==='小さじ'?5:200;unit='spoonml';
   }
   if(n==='カットトマト缶'&&unit!=='ml'){unit='g';}
   const key=n+'|'+unit;
   if(!sums.has(key))sums.set(key,{name:n,unit,qty});else sums.get(key).qty+=qty;
 })));
 let arr=[...sums.values()].sort((a,b)=>a.name.localeCompare(b.name,'ja')),el=document.getElementById('shopping');el.innerHTML='';
 if(!arr.length){el.textContent='献立を作ると食材がまとまります。';return}
 const groups={
 '肉・魚':x=>/肉|鶏|豚|牛|鮭|さば|タラ|ぶり|ひき肉/.test(x),
 '野菜・きのこ':x=>/キャベツ|玉ねぎ|にんじん|白菜|しめじ|じゃがいも|ピーマン|ブロッコリー|トマト|レタス|きゅうり|大根|ほうれん草|小松菜|ねぎ|しょうが|にんにく|もやし|れんこん|ごぼう|かぼちゃ|豆苗|パプリカ/.test(x),
 '豆腐・卵・乳製品':x=>/卵|豆腐|牛乳|バター|チーズ|厚揚げ|油揚げ|ヨーグルト/.test(x),
 '主食・加工品':x=>/ごはん|パスタ|うどん|麺|食パン|しらたき|カットトマト缶|春雨|ツナ缶|キムチ|コーン|カレールウ|シチュールウ|麻婆豆腐の素|回鍋肉の素/.test(x),
 '調味料':x=>condiments.some(k=>x.includes(k))
 };
 let done=new Set();
 for(let [g,match] of Object.entries(groups)){
   let items=arr.filter(x=>!done.has(x.name+'|'+x.unit)&&match(x.name));if(!items.length)continue;
   items.forEach(x=>done.add(x.name+'|'+x.unit));let h=document.createElement('div');h.style.cssText='font-weight:800;background:#f2f6f2;padding:7px 9px;border-radius:8px;margin-top:8px';h.textContent=g;el.append(h);items.forEach(x=>el.append(makeItem(x)));
 }
 arr.filter(x=>!done.has(x.name+'|'+x.unit)).forEach(x=>el.append(makeItem(x)));
}
function shoppingAmount(q,u){q=Math.round(q*10)/10;if(u==='spoonml'){let ml=q;if(ml>=200){let cup=Math.floor(ml/200);ml-=cup*200;let parts=[cup?cup+'カップ':''];if(ml>=15){let tbsp=Math.floor(ml/15);ml-=tbsp*15;if(tbsp)parts.push('大さじ'+tbsp)}if(ml>=5){let tsp=Math.floor(ml/5);ml-=tsp*5;if(tsp)parts.push('小さじ'+tsp)}if(ml>0)parts.push(ml+'ml');return parts.filter(Boolean).join(' ')}let parts=[];if(ml>=15){let tbsp=Math.floor(ml/15);ml-=tbsp*15;if(tbsp)parts.push('大さじ'+tbsp)}if(ml>=5){let tsp=Math.floor(ml/5);ml-=tsp*5;if(tsp)parts.push('小さじ'+tsp)}if(ml>0)parts.push(ml+'ml');return parts.join(' ')||'0ml'}return q+u}
function makeItem(x){let row=document.createElement('label');row.className='item';let cb=document.createElement('input');cb.type='checkbox';cb.onchange=()=>row.classList.toggle('done',cb.checked);let n=document.createElement('span');n.textContent=x.name;let a=document.createElement('span');a.className='amt';a.textContent=shoppingAmount(x.qty,x.unit);row.append(cb,n,a);return row}
async function copyList(){let txt='買い物リスト\\n'+[...document.querySelectorAll('.item')].map(r=>(r.querySelector('input').checked?'[購入済] ':'[ ] ')+r.querySelector('span').textContent+' '+r.querySelector('.amt').textContent).join('\\n');try{await navigator.clipboard.writeText(txt)}catch(e){let t=document.createElement('textarea');t.value=txt;document.body.append(t);t.select();document.execCommand('copy');t.remove()}document.getElementById('status').textContent='買い物リストをコピーしました。'}
renderFavs();
// 初期表示は献立タブ
showTab('menuPanel',document.querySelector('.tabs .tab'))
</script></body></html>
