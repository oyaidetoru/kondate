<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6b4f">
<title>献立おたすけ</title>
<style>
:root{--green:#2f6b4f;--pale:#edf6ef;--ink:#233128;--muted:#66736a;--line:#dce6de;--orange:#fff0d8}
*{box-sizing:border-box}body{margin:0;background:#f6f8f5;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.5}
header{background:var(--green);color:white;padding:22px 16px 20px}header h1{margin:0;font-size:1.5rem}header p{margin:5px 0 0;font-size:.9rem;opacity:.9}
main{max-width:760px;margin:auto;padding:14px}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:0 2px 8px #17351c0a}
h2{font-size:1.08rem;margin:0 0 12px}.muted{color:var(--muted);font-size:.88rem}
label{display:block;font-weight:600;margin:10px 0 6px}
select,input[type=number],input[type=text]{font:inherit;border:1px solid #cbd8ce;border-radius:10px;padding:10px;background:white;color:var(--ink);width:100%}
.checkrow{display:flex;flex-wrap:wrap;gap:10px}.pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-weight:600;background:#fff}.pill input{accent-color:var(--green);width:18px;height:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;font-weight:700;border:0;border-radius:11px;padding:12px 15px;cursor:pointer}
.primary{background:var(--green);color:white;width:100%;font-size:1.02rem;margin-top:14px}.secondary{background:var(--pale);color:var(--green)}.smallbtn{padding:7px 10px;font-size:.85rem}
.day{border:1px solid var(--line);border-radius:13px;margin:10px 0;overflow:hidden}.dayhead{background:var(--pale);padding:9px 12px;font-weight:800}.meal{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line);align-items:flex-start}.mealname{font-size:.75rem;color:var(--green);font-weight:800;min-width:38px;padding-top:2px}.mealcontent{flex:1}.mealcontent strong{display:block}.ingredients{font-size:.84rem;color:var(--muted);margin-top:3px}.empty{padding:18px;text-align:center;color:var(--muted)}
.listitem{display:flex;align-items:flex-start;gap:10px;padding:10px 2px;border-bottom:1px solid #edf1ed}.listitem:last-child{border-bottom:0}.listitem input{width:20px;height:20px;accent-color:var(--green);margin-top:2px}.listitem.checked span{text-decoration:line-through;color:#8b968e}.listitem span{flex:1}.amount{font-weight:700;white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}
.notice{background:var(--orange);padding:10px 12px;border-radius:10px;font-size:.85rem;margin-top:12px}
.hidden{display:none}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
@media(max-width:480px){main{padding:10px}.card{padding:13px}.grid2{grid-template-columns:1fr}.meal{padding:10px}}
</style>
</head>
<body>
<header><h1>🍳 献立おたすけ</h1><p>献立をランダムで決めて、買い物リストまでまとめるアプリ</p></header>
<main>
<section class="card">
<h2>① 献立の条件を選ぶ</h2>
<div class="grid2">
<div><label for="days">何日分？</label><select id="days"><option value="1">1日分</option><option value="2">2日分</option><option value="3">3日分</option><option value="4">4日分</option><option value="5">5日分</option><option value="6">6日分</option><option value="7" selected>7日分（1週間）</option><option value="14">14日分</option></select></div>
<div><label for="people">何人分？</label><select id="people"><option value="1">1人分</option><option value="2">2人分</option><option value="3">3人分</option><option value="4" selected>4人分</option><option value="5">5人分</option><option value="6">6人分</option></select></div>
</div>
<label>作りたい食事（複数選択OK）</label>
<div class="checkrow">
<label class="pill"><input type="checkbox" id="lunch"> 昼ごはん</label>
<label class="pill"><input type="checkbox" id="dinner" checked> 夜ごはん</label>
</div>
<label for="style">献立のタイプ</label>
<select id="style"><option value="all">おまかせ（和洋中まぜる）</option><option value="japanese">和食多め</option><option value="western">洋食多め</option><option value="chinese">中華多め</option><option value="quick">簡単・時短メニュー</option></select>
<label for="exclude">使いたくない食材（任意・カンマ区切り）</label>
<input id="exclude" type="text" placeholder="例：えび、きのこ、豚肉">
<div class="muted" style="margin-top:7px">※ まずは登録済みのレシピからランダムに選びます。人数に合わせて食材量を調整します。</div>
<button class="primary" onclick="generate()">🎲 献立を作る</button>
</section>

<section class="card" id="menuCard">
<div class="sectionhead"><h2>② 今週の献立</h2><button class="secondary smallbtn" onclick="generate()">別の献立にする</button></div>
<div id="menu" class="empty">条件を選んで「献立を作る」を押してください。</div>
</section>

<section class="card" id="shoppingCard">
<div class="sectionhead"><h2>③ 買い物リスト</h2><button class="secondary smallbtn" onclick="uncheckAll()">チェック解除</button></div>
<p class="muted">献立に使う食材を合算して表示します。買ったものはチェックできます。</p>
<div id="shopping" class="empty">献立を作ると、必要な食材がここにまとまります。</div>
<div class="actions"><button class="secondary" onclick="copyList()">📋 リストをコピー</button><button class="secondary" onclick="window.print()">🖨 印刷する</button></div>
<div id="copyStatus" class="muted" aria-live="polite"></div>
</section>
<p class="muted">試作版：レシピ・分量は目安です。調味料や家にある食材は、買い物前に確認してください。</p>
</main>
<script>
const recipes = [
{name:"鶏もも肉の照り焼き",type:"japanese",quick:false,ing:[["鶏もも肉","300","g"],["キャベツ","1/4","玉"],["しょうゆ","2","大さじ"],["みりん","2","大さじ"],["砂糖","1","大さじ"]]},
{name:"豚肉と玉ねぎの甘辛炒め",type:"japanese",quick:true,ing:[["豚こま肉","250","g"],["玉ねぎ","1","個"],["しょうゆ","2","大さじ"],["みりん","1","大さじ"]]},
{name:"鮭のホイル焼き",type:"japanese",quick:true,ing:[["生鮭","4","切れ"],["玉ねぎ","1/2","個"],["しめじ","1","パック"],["バター","20","g"]]},
{name:"肉じゃが",type:"japanese",quick:false,ing:[["牛こま肉","250","g"],["じゃがいも","3","個"],["にんじん","1","本"],["玉ねぎ","1","個"],["しらたき","1","袋"]]},
{name:"豚肉と白菜のうま煮",type:"japanese",quick:true,ing:[["豚こま肉","250","g"],["白菜","1/4","玉"],["にんじん","1/2","本"],["しょうゆ","2","大さじ"]]},
{name:"親子丼",type:"japanese",quick:true,ing:[["鶏もも肉","300","g"],["卵","4","個"],["玉ねぎ","1","個"],["めんつゆ","4","大さじ"],["ごはん","4","膳"]]},
{name:"さばの味噌煮",type:"japanese",quick:false,ing:[["さば","4","切れ"],["しょうが","1","かけ"],["味噌","2","大さじ"],["砂糖","1","大さじ"]]},
{name:"豆腐ハンバーグ",type:"japanese",quick:false,ing:[["合いびき肉","300","g"],["木綿豆腐","1","丁"],["玉ねぎ","1","個"],["卵","1","個"],["パン粉","1/2","カップ"]]},
{name:"カレーライス",type:"japanese",quick:false,ing:[["豚こま肉","300","g"],["じゃがいも","3","個"],["にんじん","1","本"],["玉ねぎ","2","個"],["カレールウ","1/2","箱"],["ごはん","4","膳"]]},
{name:"豚汁と焼き魚",type:"japanese",quick:false,ing:[["豚こま肉","150","g"],["大根","1/3","本"],["にんじん","1","本"],["ごぼう","1/2","本"],["味噌","3","大さじ"],["鮭","4","切れ"]]},
{name:"チキンソテー",type:"western",quick:true,ing:[["鶏もも肉","4","枚"],["ブロッコリー","1","株"],["ミニトマト","1","パック"],["にんにく","1","かけ"]]},
{name:"ミートソース",type:"western",quick:false,ing:[["合いびき肉","300","g"],["玉ねぎ","1","個"],["にんじん","1/2","本"],["トマト缶","1","缶"],["パスタ","400","g"]]},
{name:"ポークチャップ",type:"western",quick:true,ing:[["豚ロース肉","4","枚"],["玉ねぎ","1","個"],["ケチャップ","3","大さじ"],["ウスターソース","1","大さじ"]]},
{name:"クリームシチュー",type:"western",quick:false,ing:[["鶏もも肉","250","g"],["じゃがいも","2","個"],["にんじん","1","本"],["玉ねぎ","1","個"],["牛乳","400","ml"],["シチュールウ","1/2","箱"]]},
{name:"オムライス",type:"western",quick:true,ing:[["卵","4","個"],["鶏もも肉","200","g"],["玉ねぎ","1","個"],["ごはん","4","膳"],["ケチャップ","4","大さじ"]]},
{name:"タラのムニエル",type:"western",quick:true,ing:[["タラ","4","切れ"],["小麦粉","2","大さじ"],["バター","20","g"],["レモン","1","個"],["ブロッコリー","1","株"]]},
{name:"ロールキャベツ風トマト煮",type:"western",quick:false,ing:[["合いびき肉","300","g"],["キャベツ","1/2","玉"],["玉ねぎ","1","個"],["トマト缶","1","缶"]]},
{name:"豚肉の生姜焼き",type:"japanese",quick:true,ing:[["豚ロース肉","4","枚"],["玉ねぎ","1","個"],["しょうが","1","かけ"],["しょうゆ","2","大さじ"]]},
{name:"麻婆豆腐",type:"chinese",quick:true,ing:[["豚ひき肉","250","g"],["木綿豆腐","2","丁"],["長ねぎ","1","本"],["麻婆豆腐の素","1","箱"]]},
{name:"鶏肉とピーマンの炒め物",type:"chinese",quick:true,ing:[["鶏もも肉","300","g"],["ピーマン","4","個"],["パプリカ","1","個"],["焼肉のたれ","3","大さじ"]]},
{name:"回鍋肉",type:"chinese",quick:true,ing:[["豚こま肉","250","g"],["キャベツ","1/2","玉"],["ピーマン","3","個"],["回鍋肉の素","1","箱"]]},
{name:"中華あんかけ丼",type:"chinese",quick:true,ing:[["豚こま肉","200","g"],["白菜","1/8","玉"],["にんじん","1/2","本"],["うずら卵","1","袋"],["ごはん","4","膳"]]},
{name:"餃子スープ",type:"chinese",quick:true,ing:[["冷凍餃子","1","袋"],["白菜","1/8","玉"],["長ねぎ","1","本"],["鶏ガラスープの素","2","小さじ"]]},
{name:"焼きそば",type:"chinese",quick:true,ing:[["焼きそば麺","4","玉"],["豚こま肉","200","g"],["キャベツ","1/4","玉"],["にんじん","1/2","本"],["焼きそばソース","1","袋"]]},
{name:"そぼろ丼",type:"japanese",quick:true,ing:[["鶏ひき肉","300","g"],["卵","3","個"],["ごはん","4","膳"],["しょうゆ","2","大さじ"],["砂糖","1","大さじ"]]},
{name:"ツナと野菜のサンドイッチ",type:"western",quick:true,ing:[["食パン","8","枚"],["ツナ缶","2","缶"],["レタス","1/2","玉"],["きゅうり","1","本"],["マヨネーズ","2","大さじ"]]},
{name:"豚しゃぶサラダ丼",type:"japanese",quick:true,ing:[["豚しゃぶ肉","300","g"],["レタス","1/2","玉"],["トマト","2","個"],["ごはん","4","膳"],["ごまドレッシング","4","大さじ"]]},
{name:"簡単チキンカレーうどん",type:"japanese",quick:true,ing:[["冷凍うどん","4","玉"],["鶏もも肉","200","g"],["玉ねぎ","1","個"],["カレールウ","2","かけ"],["めんつゆ","3","大さじ"]]},
{name:"野菜たっぷりチャーハン",type:"chinese",quick:true,ing:[["ごはん","4","膳"],["卵","3","個"],["ハム","4","枚"],["長ねぎ","1","本"],["ミックスベジタブル","200","g"]]},
{name:"厚揚げと豚肉の煮物",type:"japanese",quick:true,ing:[["厚揚げ","2","枚"],["豚こま肉","200","g"],["小松菜","1","束"],["しょうゆ","2","大さじ"]]},
{name:"チーズ入りつくね",type:"japanese",quick:false,ing:[["鶏ひき肉","350","g"],["玉ねぎ","1/2","個"],["スライスチーズ","4","枚"],["卵","1","個"],["パン粉","1/2","カップ"]]},
{name:"トマトと卵の炒め物",type:"chinese",quick:true,ing:[["トマト","3","個"],["卵","4","個"],["長ねぎ","1/2","本"]]},
{name:"焼き鳥風丼",type:"japanese",quick:true,ing:[["鶏もも肉","350","g"],["長ねぎ","2","本"],["ごはん","4","膳"],["焼き鳥のたれ","4","大さじ"]]},
{name:"鮭チャーハン",type:"chinese",quick:true,ing:[["塩鮭","2","切れ"],["ごはん","4","膳"],["卵","3","個"],["長ねぎ","1","本"]]},
{name:"ハンバーグ",type:"western",quick:false,ing:[["合いびき肉","400","g"],["玉ねぎ","1","個"],["卵","1","個"],["パン粉","1/2","カップ"],["牛乳","2","大さじ"]]},
{name:"鶏肉の照りマヨ丼",type:"japanese",quick:true,ing:[["鶏もも肉","350","g"],["ごはん","4","膳"],["レタス","1/2","玉"],["マヨネーズ","2","大さじ"],["しょうゆ","2","大さじ"]]},
{name:"野菜たっぷり焼きうどん",type:"japanese",quick:true,ing:[["冷凍うどん","4","玉"],["豚こま肉","200","g"],["キャベツ","1/4","玉"],["にんじん","1/2","本"],["しょうゆ","2","大さじ"]]}
];
let currentMeals=[];
function norm(s){return s.toLowerCase().replace(/\s/g,"")}
function generate(){
 const days=+document.getElementById('days').value, people=+document.getElementById('people').value;
 const lunch=document.getElementById('lunch').checked, dinner=document.getElementById('dinner').checked;
 if(!lunch&&!dinner){alert('昼ごはんか夜ごはんを1つ以上選んでね。');return}
 const style=document.getElementById('style').value;
 const excludes=document.getElementById('exclude').value.split(/[、,，]/).map(s=>norm(s.trim())).filter(Boolean);
 let pool=recipes.filter(r=>(style==='all'||(style==='quick'?r.quick:r.type===style))&&!r.ing.some(i=>excludes.some(e=>norm(i[0]).includes(e))));
 if(!pool.length){alert('条件に合うレシピがありません。使いたくない食材を減らすか、タイプを「おまかせ」にしてね。');return}
 currentMeals=[];let previous={lunch:'',dinner:''};
 for(let d=0;d<days;d++){
  for(const meal of ['lunch','dinner']){
   if((meal==='lunch'&&!lunch)||(meal==='dinner'&&!dinner))continue;
   let choices=pool.filter(r=>r.name!==previous[meal]);
   if(!choices.length)choices=pool;
   const recipe=choices[Math.floor(Math.random()*choices.length)];
   previous[meal]=recipe.name;
   currentMeals.push({day:d+1,meal,recipe,people});
  }
 }
 renderMenu();renderShopping();
}
function renderMenu(){
 const el=document.getElementById('menu');el.innerHTML='';
 const days=+document.getElementById('days').value;
 for(let d=1;d<=days;d++){
  const items=currentMeals.filter(m=>m.day===d);if(!items.length)continue;
  const box=document.createElement('div');box.className='day';
  const head=document.createElement('div');head.className='dayhead';head.textContent=`${d}日目`;box.appendChild(head);
  items.forEach(m=>{const row=document.createElement('div');row.className='meal';
   const tag=document.createElement('div');tag.className='mealname';tag.textContent=m.meal==='lunch'?'昼ごはん':'夜ごはん';
   const content=document.createElement('div');content.className='mealcontent';
   const title=document.createElement('strong');title.textContent=m.recipe.name;
   const ing=document.createElement('div');ing.className='ingredients';ing.textContent='主な食材：'+m.recipe.ing.map(i=>i[0]).join('、');
   content.append(title,ing);row.append(tag,content);box.appendChild(row);
  });el.appendChild(box);
 }
}
function renderShopping(){
 const sums=new Map();const people=+document.getElementById('people').value;
 currentMeals.forEach(m=>m.recipe.ing.forEach(([name,qty,unit])=>{
  const key=name+'__'+unit;const n=parseFloat(qty)*people/4;
  if(!sums.has(key))sums.set(key,{name,unit,amount:0,approx:!Number.isFinite(n)});
  sums.get(key).amount+=n;
 }));
 const list=[...sums.values()].sort((a,b)=>a.name.localeCompare(b.name,'ja'));
 const el=document.getElementById('shopping');el.innerHTML='';
 if(!list.length){el.textContent='食材はまだありません。';return}
 const groups={'肉・魚':['肉','鶏','豚','牛','ひき肉','鮭','さば','タラ','魚','ハム'],'野菜・きのこ':['キャベツ','玉ねぎ','にんじん','白菜','しめじ','じゃがいも','ピーマン','パプリカ','ブロッコリー','トマト','レタス','きゅうり','大根','ごぼう','ねぎ','小松菜','しょうが','にんにく','レモン'],'卵・乳製品':['卵','豆腐','牛乳','バター','チーズ'],'主食・加工品':['ごはん','パスタ','うどん','麺','食パン','餃子','厚揚げ','しらたき','うずら卵','ミックスベジタブル','トマト缶'],'調味料・その他':[]};
 const assigned=new Set();
 for(const [group,keys] of Object.entries(groups)){
  const items=list.filter(x=>!assigned.has(x.name)&& (group==='調味料・その他'||keys.some(k=>x.name.includes(k))));
  if(!items.length)continue;
  items.forEach(x=>assigned.add(x.name));
  const gh=document.createElement('div');gh.style.cssText='font-weight:800;background:#f2f6f2;padding:7px 9px;border-radius:8px;margin-top:8px';gh.textContent=group;el.appendChild(gh);
  items.forEach(x=>el.appendChild(makeItem(x)));
 }
 list.filter(x=>!assigned.has(x.name)).forEach(x=>el.appendChild(makeItem(x)));
}
function formatAmount(n,unit){
 if(unit==='個'||unit==='玉'||unit==='本'||unit==='丁'||unit==='株'||unit==='束'||unit==='袋'||unit==='缶'||unit==='箱'||unit==='切れ'||unit==='枚'||unit==='膳'||unit==='玉'||unit==='かけ'||unit==='パック')return (Math.round(n*10)/10)+unit;
 return (Math.round(n*10)/10)+unit;
}
function makeItem(x){
 const row=document.createElement('label');row.className='listitem';
 const cb=document.createElement('input');cb.type='checkbox';cb.addEventListener('change',()=>row.classList.toggle('checked',cb.checked));
 const name=document.createElement('span');name.textContent=x.name;
 const amount=document.createElement('span');amount.className='amount';amount.textContent=formatAmount(x.amount,x.unit);
 row.append(cb,name,amount);return row;
}
function uncheckAll(){document.querySelectorAll('.listitem input').forEach(c=>{c.checked=false;c.closest('.listitem').classList.remove('checked')})}
async function copyList(){
 const rows=[...document.querySelectorAll('.listitem')].map(r=>`${r.querySelector('input').checked?'[購入済]':'[ ]'} ${r.querySelector('span').textContent} ${r.querySelector('.amount').textContent}`);
 const textValue='買い物リスト\n'+rows.join('\n');
 try{await navigator.clipboard.writeText(textValue);document.getElementById('copyStatus').textContent='買い物リストをコピーしました！'}
 catch(e){const ta=document.createElement('textarea');ta.value=textValue;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();document.getElementById('copyStatus').textContent='買い物リストをコピーしました！'}
}
</script>
</body>
</html>
